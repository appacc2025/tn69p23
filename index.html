<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผักสวนครัวในรั้วธิดา | Thida Organic Farm Exhibition</title>
    
    <!-- ฟอนต์พรีเมียม สไตล์โฮมเมดออร์แกนิกหรูหรา -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Anuphan:wght@300;400;500;600&family=Noto+Serif+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ================= PREMIUM COLOR PALETTE ================= */
        :root {
            --luxury-dark: #0A1E12;     /* สีเขียวป่าลึกออร์แกนิก */
            --luxury-light: #E8F0EA;    /* สีเขียวอ่อนใบตองพาสเทล */
            --accent-gold: #D4AF37;     /* สีทองคำหรูหรา */
            --bg-canvas: #FAF9F6;       /* สีขาวครีมวานิลลาสะอาดตา */
            --card-white: #FFFFFF;
            --font-main: 'Anuphan', sans-serif;
            --font-serif: 'Noto Serif Thai', serif;
            --box-shadow: 0 15px 40px rgba(10, 30, 18, 0.06);
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-canvas);
            color: var(--luxury-dark);
            line-height: 1.7;
            width: 100%;
        }

        /* ================= LUXURY HEADER & BUTTONS ================= */
        header {
            background-color: var(--card-white);
            border-bottom: 2px solid var(--luxury-light);
            padding: 35px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            width: 100%;
        }

        .brand-title {
            font-family: var(--font-main);
            font-size: 32px;
            letter-spacing: 1px;
            color: var(--luxury-dark);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .brand-subtitle {
            font-family: var(--font-main);
            font-size: 15px;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* แถบเมนูปุ่มกดขยายกว้างแผ่เต็มหน้าจอ */
        .navigation-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 0 2%;
        }

        .nav-btn {
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: var(--box-shadow);
            transition: all 0.3s ease;
            white-space: nowrap;
            background-color: var(--luxury-light);
            color: var(--luxury-dark);
            border: 1px solid rgba(10, 30, 18, 0.05);
        }

        /* 🏠 ปุ่มหน้าแรกสีเขียวเข้มพรีเมียม */
        .nav-btn-home {
            background-color: var(--luxury-dark) !important;
            color: var(--card-white) !important;
            border: 1px solid var(--luxury-dark);
        }

        .nav-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 35px rgba(10, 30, 18, 0.12);
            border-color: var(--accent-gold);
        }

        /* ================= MAIN CONTAINER ขยายเต็มหน้าจอ 100% ================= */
        .main-container {
            width: 100%;
            margin: 40px 0;
            padding: 0 4% !important;
        }

        /* ================= กล่องเนื้อหาสีขาวขยายกว้างเต็มหน้าจอ 100% ================= */
        .content-block {
            background-color: var(--card-white);
            border-radius: 16px;
            padding: 50px;
            box-shadow: var(--box-shadow);
            margin-bottom: 60px;
            border: 1px solid rgba(0,0,0,0.02);
            width: 100%;
        }

        .overview-hero, .veggie-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .hero-text-content, .veggie-text-content {
            width: 100%;
            margin-bottom: 25px;
        }

        /* รูปภาพหลักล็อก Aspect Ratio สมดุลทุกขนาดหน้าจอ */
        .hero-img, .veggie-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: clamp(300px, 45vh, 520px);
            object-fit: cover;
            object-position: center 30%;
            border-radius: 16px;
            box-shadow: var(--box-shadow);
            margin-top: 15px;
            display: block;
        }

        /* ================= 📸 PREMIUM AUTO SLIDER CSS ================= */
        .slider-section {
            margin-top: 40px;
            border-top: 1px solid var(--luxury-light);
            padding-top: 40px;
            width: 100%;
            overflow: hidden; /* ล็อกไม่ให้ขอบรูปสไลด์ล้นหน้าจอ */
        }

        .premium-slider-container {
            display: flex;
            gap: 20px;
            width: max-content;
            /* 🌟 สั่งให้แถบสไลด์วิ่งอัตโนมัติแบบต่อเนื่องลูปไม่รู้จบ */
            animation: thidaAutoSlide 25s linear infinite;
        }

        /* เมื่อเอาเมาส์มาวางชี้ ให้ภาพหยุดนิ่งชั่วคราว */
        .premium-slider-container:hover {
            animation-play-state: paused !important;
        }

        @keyframes thidaAutoSlide {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } /* วนลูปกลับมาตำแหน่งเดิมไร้รอยสะดุด */
        }

        .slide-item {
            flex: 0 0 clamp(280px, 35vw, 500px);
            max-width: 85vw;
            aspect-ratio: 4 / 3;
            scroll-snap-align: start;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--box-shadow);
            border: 1px solid rgba(10, 30, 18, 0.05);
        }

        .slide-photo {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* การ์ดกิจกรรม 3 ใบด้านล่างสุด */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 50px;
            width: 100%;
        }

        .gallery-card {
            background-color: var(--bg-canvas);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            background-size: cover;
            background-position: center;
        }

        .card-body {
            padding: 25px;
        }

        .card-body h3 {
            font-family: var(--font-serif);
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--luxury-dark);
        }

        .card-body p {
            font-size: 14px;
            color: #617066;
        }

        .group-tag {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 12px;
            display: block;
        }

        .content-block h2 {
            font-family: var(--font-serif);
            font-size: 38px;
            margin-bottom: 20px;
        }

        .content-block h3 {
            font-family: var(--font-serif);
            font-size: 34px;
            margin-bottom: 20px;
        }

        .veggie-desc {
            font-size: 16px;
            color: #4A574E;
        }

        .student-box {
            border-top: 1px solid var(--luxury-light);
            padding-top: 25px;
            margin-top: 40px;
            width: 100%;
        }

        .student-box h4 {
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--accent-gold);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .student-flex {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .student-badge {
            background-color: var(--luxury-light);
            color: var(--luxury-dark);
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .content-block { padding: 25px; }
            .hero-img, .veggie-img { aspect-ratio: 4 / 3; height: auto; }
            .content-block h2 { font-size: 28px; }
            .content-block h3 { font-size: 26px; }
        }
    </style>
</head>

    <div class="main-container">
